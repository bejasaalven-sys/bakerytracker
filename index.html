<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah's Bakery Inventory Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="hero-header">
            <h1 class="display-title">🥖 Sarah's Bakery Tracker</h1>
            <p class="hero-subtitle">Track, use, save - Never waste again!</p>
        </header>

        <!-- Stats Cards - UPDATED CATEGORIES -->
        <section class="stats-grid">
            <div class="stat-card expired">
                <div class="stat-number" id="expiredCount">0</div>
                <div class="stat-label"> EXPIRED</div>
                <small class="stat-subtitle">Past expiry date</small>
            </div>
            <div class="stat-card warning">
                <div class="stat-number" id="warningCount">0</div>
                <div class="stat-label">⚠️ WATCH</div>
                <small class="stat-subtitle">&lt;7 days left</small>
            </div>
            <div class="stat-card used">
                <div class="stat-number" id="usedCount">0</div>
                <div class="stat-label">✅ USED</div>
                <small class="stat-subtitle">Successfully used</small>
            </div>
            <div class="stat-card total">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">TOTAL ITEMS</div>
                <small class="stat-subtitle">All ingredients</small>
            </div>
        </section>

        <!-- Add Item Form -->
        <section class="form-section">
            <div class="form-card">
                <h3 class="form-title">
                    <span class="icon">➕</span>
                    Add New Ingredient
                </h3>
                <form id="addItemForm" class="input-grid">
                    <div class="input-group">
                        <label for="itemName">Ingredient Name</label>
                        <input type="text" id="itemName" placeholder="Sourdough starter" required>
                    </div>
                    <div class="input-group">
                        <label for="itemQuantity">Quantity</label>
                        <input type="text" id="itemQuantity" placeholder="2kg" required>
                    </div>
                    <div class="input-group">
                        <label for="itemExpiry">Expires</label>
                        <input type="date" id="itemExpiry" required>
                    </div>
                    <button type="submit" class="btn-primary">Add Ingredient</button>
                </form>
            </div>
        </section>

        <!-- Inventory List -->
        <section class="inventory-section">
            <div class="inventory-header">
                <h3 class="section-title">📦 Current Inventory</h3>
                <button class="btn-danger" id="clearAllBtn">
                    <span class="icon">🗑️</span> Clear All
                </button>
            </div>
            <div id="inventoryList" class="inventory-list">
                <!-- Items dynamically rendered here -->
            </div>
        </section>
    </div>
      <script src="function.js"></script>
</body>
</html>
